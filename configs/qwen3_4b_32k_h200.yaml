# 单卡 H200 141GB 长生成吞吐示例（32k context，TP1）。
# 只有 model.runtime 和 output 中的 IO 参数与硬件相关；dataset、prompt、
# decode 按评测合同填写。vLLM 未显式设置时 max_num_seqs 在 >=70GB GPU
# 上默认 1024，这里显式写出以免随 vLLM 版本变化；enforce_eager 默认 false
# （捕获 CUDA graph）。request_batch_size 是每次阻塞调用 llm.generate 交给
# vLLM 的请求数，须等该批最长样本结束才提交下一批；设为 max_num_seqs 的
# 2 倍，让 vLLM 始终有排队请求可补位（2026-11-23 由 512 调为 2048：
# 实测 512 时长尾阶段 GPU 闲置，MMLU-Pro 类短回答 bench 估计提速约 1.4x）。
# 再调大收益递减，且被抢占或中断时丢失整批。显存不足时先下调 max_num_seqs
# （如 256），不要把 request_batch_size 压到很小。
dataset:
  name: example_math
  path: data/example_math.jsonl

prompt: prompts/math-chat

model:
  name: Qwen3-4B
  backend: vllm
  path: Qwen/Qwen3-4B
  input_mode: chat
  thinking: false
  runtime:
    tensor_parallel_size: 1
    dtype: bfloat16
    max_context_tokens: 32768
    gpu_memory_utilization: 0.92
    max_num_seqs: 1024
    request_batch_size: 2048

decode:
  temperature: 0.6
  top_p: 0.95
  seed: 0
  max_output_tokens: 31744
  samples_per_problem: 16

output:
  root: outputs/runs
  shard_size: 5000
  compression: none
  fsync_every: 1
